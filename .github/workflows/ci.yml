name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # NODE_OPTIONS=--openssl-legacy-provider is the canonical fix for
    # CRA 5 + Node 17+. webpack-cli in older react-scripts versions
    # uses deprecated OpenSSL APIs that newer Node versions removed.
    # Combined with CI=true, this resolves the build failures we
    # were seeing on GitHub runners with Node 20/22 even though
    # local builds succeeded on the same Node version.
    env:
      CI: true
      NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test --watchAll=false

      - name: Production build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7
          if-no-files-found: warn
