name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the last Node 20 LTS that was well-tested with CRA 5.
      # If both this AND CI=false on build don't fix the build, the next
      # thing to try is downgrading react-scripts itself, which is out
      # of scope for a CI fix.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          CI: true

      - name: Run tests
        run: yarn test --watchAll=false
        env:
          CI: true

      # CRA's build script treats ESLint warnings as errors when
      # process.env.CI === 'true'. GitHub Actions sets CI=true
      # automatically, which makes the production build fail on any
      # inconsequential warning (unused imports, console statements,
      # etc.). Override to false for the build step only so tests
      # still get the strict-mode behavior but the build doesn't
      # fail on harmless warnings.
      - name: Production build
        run: yarn build
        env:
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7
          if-no-files-found: warn
